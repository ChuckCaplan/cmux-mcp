# The server and its tests are Python 3 stdlib only, so there is no pip
# manifest to track. The only external dependencies are the actions pinned
# in .github/workflows/, which is what this configuration watches. If a
# Python dependency is ever added, add a matching "pip" entry here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    # Only a couple of actions are in use; batch them into one PR.
    groups:
      github-actions:
        patterns:
          - "*"
